services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - raceday-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000" # Blob service
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    networks:
      - raceday-network

  api:
    build:
      context: .
      dockerfile: RaceDayAPI.Dockerfile
    depends_on:
      - sql
      - azurite
    restart: on-failure
    environment:
      ConnectionStrings__RaceDayConnection: "Server=sql,1433;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      # CRITICAL: Use the Azurite container for Blob Storage
      ConnectionStrings__AzureBlobStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5108:8080"
    networks:
      - raceday-network

  web:
    build:
      context: ./RaceDayMVC
    depends_on:
      - api
    environment:
      ApiSettings__BaseUrl: http://api:8080
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5200:8080"
    networks:
      - raceday-network

volumes:
  sqldata:

networks:
  raceday-network:
    driver: bridge